<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<title>Situazione flotta</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#26324d;--tx:#e8edf7;--mu:#8b97b0;
--ok:#3ccf6e;--warn:#f5b942;--ko:#ff5a5a;--ind:#b48cff;--off:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1100px;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
h1{font-size:20px;margin:0;flex:1 1 auto}
.sub{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--tx);
padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer}
.btn.pri{background:#2b5cff;border-color:#2b5cff}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin:4px 0 12px}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-bottom:3px solid var(--line);
background:var(--card);color:var(--mu);padding:6px 2px;border-radius:10px;font:inherit;font-size:12px;cursor:pointer}
.tabs button b{font-size:13px;color:var(--mu);white-space:nowrap}
.tabs button[data-p="0"]{flex:.7}
.tabs button.on{background:var(--card2);border-bottom-color:var(--c)}
.tabs button.on b{color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 10px 0}
.chips button{border:1px solid var(--line);background:var(--card2);color:var(--mu);padding:5px 10px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:#2b5cff;border-color:#2b5cff;color:#fff}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--mu);padding:10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on[data-e="1"]{background:var(--ok);border-color:var(--ok);color:#062312}
.seg button.on[data-e="0"]{background:var(--ko);border-color:var(--ko);color:#fff}
details summary{cursor:pointer;color:#7aa2ff;font-weight:600;margin:16px 0 4px}
.pager{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pager>*{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.nr{align-items:flex-start}
.nr .m{white-space:normal}
.nr .m div{margin-top:2px;overflow-wrap:anywhere}
.linea{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.lh{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lh img{width:96px;height:48px;object-fit:contain;flex:none}
.lh .t{flex:1;min-width:0}
.lh .t b{font-size:17px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px;padding:10px}
.tile{position:relative;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:9px;padding:5px 7px;cursor:pointer;min-width:0;text-align:left;color:var(--tx);font:inherit}
.tile b{display:block;font-size:17px}
.tile .st{font-size:11px;font-weight:600;color:var(--st);white-space:nowrap}
.tile .pill{position:absolute;top:4px;right:4px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pill{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 4px;color:var(--mu)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.list h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);border-left:4px solid var(--lv);cursor:pointer}
.row:last-child{border-bottom:0}
.row .a{width:64px;flex:none}
.row .a b{display:block}
.row .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:#000a}
.dh{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.dh img{width:72px;height:36px;object-fit:contain}
.dh .t{flex:1}
.db{padding:4px 12px 14px}
.db h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right}
.note{background:var(--card2);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px}
.note p{margin:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{color:var(--mu);display:block}
.note button{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:0 4px}
textarea,input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
textarea{min-height:70px;resize:vertical}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222c44;border:1px solid var(--line);padding:9px 14px;border-radius:10px;max-width:calc(100vw - 32px)}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
a{color:#7aa2ff}
</style>
</head>
<body>
<main id="app"><p class="empty">Caricamento...</p></main>
<dialog id="dlg"></dialog>
<script src="giornaliera.js"></script>
<script src="pat.js"></script>
<script>
"use strict";
const API = "https://api.github.com/repos/rdagmr98/situazione-flotta-data/contents/";
const ORE_WARN = 25 * 60, GG_WARN = 60; // stesse soglie del SIEL: < 25 h o < 60 giorni
const TIPI = { // silhouette e colori di AVES Tecnici (helicopter_catalog.dart)
  "RH-206C": ["ab206", "#FFC14D"], "UH-205A": ["uh205", "#FF8A65"],
  "UH-169B": ["uh169b", "#35C2FF"], "UH-169D": ["uh169d", "#7CF29A"] };
const STATI = { "IN LINEA": ["ok", "IN LINEA"], "DISPONIBILE": ["warn", "DISP."], "INDISPONIBILE": ["ko", "INDISP."],
  "INDUSTRIA": ["ind", "INDUSTRIA"], "ALIENAZIONE": ["off", "ALIEN."] };
const CAT = { eff: ["ok", "EFF", "Efficiente"], ineff: ["ko", "INEFF", "Inefficiente"], ind: ["ind", "IND.", "In industria"], alien: ["off", "ALIEN.", "In alienazione"] };
const FILTRI = [["tutti", "Tutti", () => true], ["eff", "Efficienti", (c) => c === "eff"], ["ineff", "Inefficienti", (c) => c === "ineff" || c === "ind"],
  ["ind", "Industria", (c) => c === "ind"], ["alien", "Alienazione", (c) => c === "alien"]];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let PAT = ""; // in chiaro solo in memoria: nella pagina pubblica c'è cifrato (pat.js)
const ls = (k, v) => { try { return v === undefined ? localStorage.getItem(k) || "" : localStorage.setItem(k, v); } catch (_) { return ""; } };
// stati.json = { sigla: { e: efficiente?, m: motivo, d: giorno } }: correzione a mano, vale finché non arriva una giornaliera più recente
const S = { g: null, note: {}, stati: {}, vista: "macchine", flotta: ls("sf_flotta"), filtro: ls("sf_filtro") || "tutti", info: false };

// --- formati ---
const fh = (m) => m == null ? "–" : (m < 0 ? "-" : "") + Math.floor(Math.abs(m) / 60) + ":" + String(Math.abs(m) % 60).padStart(2, "0");
const fd = (d) => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "–";
const oggi = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const giorni = (d) => Math.round((new Date(d + "T00:00:00") - oggi()) / 864e5);
const tipo = (t) => TIPI[t] || ["ab206", "#8b97b0"];
const stato = (s) => STATI[s] || ["off", s || "?"];
function livello(sc) { // 2 = scaduta, 1 = vicina, 0 = ok, -1 = senza valore
  if (sc.ore != null) return sc.ore <= 0 ? 2 : sc.ore < ORE_WARN ? 1 : 0;
  if (sc.data) { const g = giorni(sc.data); return g < 0 ? 2 : g < GG_WARN ? 1 : 0; }
  return -1;
}
const LV = ["var(--ok)", "var(--warn)", "var(--ko)"];
const valore = (sc) => sc.ore != null ? fh(sc.ore) + " h" : sc.data ? fd(sc.data) + " (" + giorni(sc.data) + " gg)" : esc(sc.raw || "–");
const vive = (a) => a.stato !== "ALIENAZIONE";
const giornoIso = () => new Date().toLocaleDateString("sv-SE"); // AAAA-MM-GG locale, non UTC
function eff(a, aMano = true) { // { c: chiave di CAT, m: motivo, man: correzione a mano valida }
  if (!vive(a)) return { c: "alien", m: "" };
  const o = aMano && S.stati[a.sigla];
  if (o && o.d >= S.g.data) return { c: o.e ? "eff" : "ineff", m: o.m, man: o };
  if (a.stato === "INDUSTRIA") return { c: "ind", m: a.attivita };
  if (a.stato !== "IN LINEA") return { c: "ineff", m: a.attivita };
  const z = a.scadenze.find((s) => s.ore != null && s.ore <= 0); // in linea ma senza ore: non può volare
  return z ? { c: "ineff", m: "ore a zero, " + z.tipo } : { c: "eff", m: "" };
}
function conta(aerei) { const v = aerei.filter(vive), e = v.filter((a) => eff(a).c === "eff").length; return [e, v.length, Math.round(100 * e / (v.length || 1))]; }

// --- dati: repo privato via GitHub Contents API ---
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, cache: "no-store", headers: {
    Authorization: "Bearer " + PAT, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "Token non valido o senza accesso al repo dati" : "Errore GitHub " + r.status);
  return r.json();
}
const dec = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
const enc = (s) => { let b = ""; new TextEncoder().encode(s).forEach((x) => b += String.fromCharCode(x)); return btoa(b); };
async function leggi(path) { const j = await gh(path); return j ? { sha: j.sha, data: JSON.parse(dec(j.content)) } : { sha: null, data: null }; }
async function scrivi(path, data, msg) {
  const { sha } = await leggi(path); // sha fresco: niente 409 se l'altro dispositivo ha scritto nel frattempo
  await gh(path, { method: "PUT", body: JSON.stringify({ message: msg, content: enc(JSON.stringify(data, null, 1)), sha: sha || undefined }) });
}
async function carica() {
  const dir = (await gh("giornaliere")) || [];
  const ult = dir.map((f) => f.name).filter((n) => /\.json$/.test(n)).sort().pop();
  const [g, n, s] = await Promise.all([ult ? leggi("giornaliere/" + ult) : { data: null }, leggi("note.json"), leggi("stati.json")]);
  S.g = g.data; S.note = n.data || {}; S.stati = s.data || {};
}
async function aggiorna(file, sigla, fn) { // rilegge, modifica, scrive: le modifiche dell'altro dispositivo non si perdono
  const cur = (await leggi(file + ".json")).data || {};
  const v = fn(cur[sigla]);
  if (v == null || v.length === 0) delete cur[sigla]; else cur[sigla] = v;
  await scrivi(file + ".json", cur, file + " " + sigla);
  S[file] = cur;
}

// --- viste ---
function toast(t) { const d = document.createElement("div"); d.className = "msg"; d.textContent = t; document.body.append(d); setTimeout(() => d.remove(), 3500); }
function vistaFrase(err) {
  $("#app").innerHTML = `<header><h1>Situazione flotta</h1></header>
  <form class="list" style="padding:14px" id="fr">
   <p>Frase di accesso (una volta per dispositivo, resta in questo browser).</p>
   ${err ? `<p style="color:var(--ko)">${esc(err)}</p>` : ""}
   <input type="password" id="tok" autocomplete="current-password" autocapitalize="none">
   <p><button class="btn pri">Entra</button></p></form>`;
  $("#fr").onsubmit = (e) => { e.preventDefault(); ls("sf_frase", $("#tok").value.trim().toLowerCase()); avvia(); };
}
function render() {
  const g = S.g;
  const imp = `<label class="btn pri">Importa<input type="file" accept=".ods" id="file" hidden></label>`;
  if (!g) {
    $("#app").innerHTML = `<header><h1>Situazione flotta</h1>${imp}</header>
      <p class="empty">Nessuna giornaliera ancora. Dal PC: «Importa giornaliera» e scegli il file SIT_GIOR_CAAE .ods.</p>`;
    $("#file").onchange = importa; return;
  }
  const [E, T, P] = conta(g.linee.flatMap((l) => l.aerei));
  const pag = ["note", ...g.linee.map((l) => l.tipo)], k0 = pag.indexOf(S.flotta), i = k0 < 0 ? 1 : k0;
  const ann = g.linee.flatMap((l) => l.aerei.filter((a) => S.note[a.sigla] || eff(a).man).map((a) => [l, a]));
  $("#app").innerHTML = `<header><h1>Situazione flotta</h1>${imp}
    <div class="sub" style="flex-basis:100%">Giornaliera del <b>${fd(g.data)}</b> · efficienti ${E} su ${T} (${P}%)</div></header>
   <nav class="tabs"><button data-p="0" style="--c:#7aa2ff"><b>Note</b>${ann.length}</button>${g.linee.map((x, k) => { const [a, b] = conta(x.aerei);
     return `<button data-p="${k + 1}" style="--c:${tipo(x.tipo)[1]}"><b>${esc(x.tipo)}</b>${a}/${b}</button>`; }).join("")}</nav>
   <div class="pager" id="pg"><section class="list"><h2>Note e correzioni a mano</h2>${ann.map(annotata).join("")
     || '<p class="empty">Nessuna nota: tocca una macchina per aggiungerne.</p>'}</section>${g.linee.map(pagina).join("")}</div>
   <p class="sub" style="text-align:center">Importata ${new Date(g.importata).toLocaleString("it-IT")}</p>`;
  const pg = $("#pg"), tabs = document.querySelectorAll("[data-p]"), passo = () => pg.clientWidth + 16; // 16 = gap del pager
  const segna = (k) => { tabs.forEach((b, j) => b.classList.toggle("on", j === k)); if (pag[k] !== S.flotta) { S.flotta = pag[k]; ls("sf_flotta", S.flotta); } };
  tabs.forEach((b) => b.onclick = () => pg.scrollTo({ left: +b.dataset.p * passo(), behavior: "smooth" }));
  pg.onscroll = () => segna(Math.round(pg.scrollLeft / passo()));
  pg.scrollLeft = i * passo(); segna(i);
  document.querySelectorAll("[data-k]").forEach((b) => b.onclick = () => { S.filtro = b.dataset.k; ls("sf_filtro", S.filtro); render(); });
  document.querySelectorAll("[data-vi]").forEach((b) => b.onclick = () => { S.vista = S.vista === "macchine" ? "scad" : "macchine"; render(); });
  document.querySelectorAll("[data-s]").forEach((e) => e.onclick = () => dettaglio(e.dataset.s));
  $("#file").onchange = importa;
}
function pagina(l) { // una pagina dello swipe per ogni flotta
  const [img, col] = tipo(l.tipo), [e, t, pc] = conta(l.aerei), cats = l.aerei.map((a) => eff(a).c);
  const urg = l.aerei.filter(vive).flatMap((a) => a.scadenze).filter((s) => livello(s) >= 1).length;
  const filtro = FILTRI.find((f) => f[0] === S.filtro) || FILTRI[0], mac = S.vista === "macchine";
  return `<section class="linea"><div class="lh"><img src="img/${img}.webp" alt="">
     <div class="t"><b style="color:${col}">${esc(l.tipo)}</b><div class="sub">Efficienti ${e} su ${t} · ${pc}% · ore mese ${fh(l.totMese)}</div>
     <div class="bar"><i style="width:${pc}%;background:${col}"></i></div></div>
     <button class="btn" data-vi>${mac ? `Scadenze${urg ? ` <b style="color:var(--warn)">${urg}</b>` : ""}` : "Macchine"}</button></div>
    ${mac ? `<div class="chips">${FILTRI.map(([k, n, f]) => { const c = cats.filter(f).length;
      return c || k === "tutti" || k === "eff" || k === "ineff" || k === filtro[0] ? `<button data-k="${k}" class="${k === filtro[0] ? "on" : ""}">${n} ${c}</button>` : ""; }).join("")}</div>
     <div class="grid">${l.aerei.filter((a) => filtro[2](eff(a).c)).map(tile).join("") || '<p class="sub">Nessuno</p>'}</div>` : scadenze(l)}</section>`;
}
function annotata([l, a]) { // riga della pagina Note: sigla, motivo, note, efficienza
  const x = eff(a), [c, s] = CAT[x.c], mot = x.man ? (x.m || "cambiata a mano") + " · " + fd(x.man.d).slice(0, 5) : x.m;
  return `<div class="row nr" data-s="${esc(a.sigla)}" style="--lv:var(--${c})"><div class="a"><b>${esc(a.sigla)}</b><span class="sub">${esc(l.tipo)}</span></div>
    <div class="m">${mot ? `<span class="sub">${esc(mot)}</span>` : ""}${(S.note[a.sigla] || []).map((n) => `<div>${esc(n.t)} <span class="sub">${fd(n.d).slice(0, 5)}</span></div>`).join("")}</div>
    <div class="v"><b style="color:var(--${c})">${s}${x.man ? "*" : ""}</b></div></div>`;
}
function tile(a) {
  const x = eff(a), [c, s] = CAT[x.c], n = (S.note[a.sigla] || []).length;
  return `<button class="tile" data-s="${esc(a.sigla)}" style="--st:var(--${c})"><b>${esc(a.sigla)}</b>
    <span class="st">${s}${x.man ? "*" : ""}</span>${n ? `<span class="pill">✎${n}</span>` : ""}</button>`;
}
function scadenze(l) {
  const voci = l.aerei.filter(vive).flatMap((a) => a.scadenze.map((s) => ({ a, s })));
  const riga = ({ a, s }) => `<div class="row" data-s="${esc(a.sigla)}" style="--lv:${LV[Math.max(livello(s), 0)]}">
    <div class="a"><b>${esc(a.sigla)}</b></div><div class="m">${esc(s.tipo)}</div><div class="v">${valore(s)}</div></div>`;
  const ore = voci.filter((v) => v.s.ore != null).sort((x, y) => x.s.ore - y.s.ore);
  const dat = voci.filter((v) => v.s.data).sort((x, y) => x.s.data.localeCompare(y.s.data));
  return `<div class="list"><h2>A ore (residuo)</h2>${ore.map(riga).join("") || '<p class="empty">Nessuna</p>'}</div>
    <div class="list"><h2>A data</h2>${dat.map(riga).join("") || '<p class="empty">Nessuna</p>'}</div>`;
}
function dettaglio(sigla) {
  const l = S.g.linee.find((x) => x.aerei.some((a) => a.sigla === sigla)), a = l.aerei.find((x) => x.sigla === sigla);
  const [img, col] = tipo(l.tipo), x = eff(a), auto = eff(a, false), [c, , s] = CAT[x.c], note = S.note[sigla] || [];
  const tr = (k, v) => v ? `<tr><td>${k}</td><td>${v}</td></tr>` : "";
  const d = $("#dlg");
  d.innerHTML = `<div class="dh"><img src="img/${img}.webp" alt=""><div class="t"><b style="font-size:20px">${esc(sigla)}</b>
    <div class="sub" style="color:${col}">${esc(l.tipo)} · MM ${esc(a.mm)}</div></div>
    <span class="st" style="color:var(--${c});font-weight:700">${s}</span><button class="btn" id="cl">Chiudi</button></div>
   <div class="db">
    <h3>Efficienza</h3>
    <p class="sub">Giornaliera: ${esc(stato(a.stato)[1])}${auto.m ? " · " + esc(auto.m) : ""}</p>
    ${x.man ? `<p>Cambiata a mano il ${fd(x.man.d)}${x.man.m ? ": " + esc(x.man.m) : ""}. Vale fino alla prossima giornaliera.</p>` : ""}
    ${vive(a) ? `<label class="sub" for="mo">Motivo (si salva toccando Efficiente o Inefficiente)</label>
     <input id="mo" placeholder="es. guasto a fine giornata, attesa messa in moto" value="${esc(x.man ? x.man.m : "")}">
     <div class="seg"><button data-e="1" class="${x.c === "eff" ? "on" : ""}">Efficiente</button><button data-e="0" class="${x.c !== "eff" ? "on" : ""}">Inefficiente</button></div>
     ${x.man ? `<button class="btn" id="rp">Torna alla giornaliera</button>` : ""}` : ""}
    <h3>Note</h3>${note.map((n, i) => `<div class="note"><p data-ed="${i}"><small>${fd(n.d)} · tocca per modificare</small>${esc(n.t)}</p><button data-del="${i}" aria-label="Elimina nota">×</button></div>`).join("")}
    <textarea id="nt" placeholder="Annota qualcosa su ${esc(sigla)}..."></textarea>
    <p><button class="btn pri" id="ns">Aggiungi nota</button></p>
    <details ${S.info ? "open" : ""}><summary>Dettagli</summary>
    ${a.attivita || a.inizio ? `<h3>Attività</h3><table>${tr("Descrizione", esc(a.attivita))}${tr("Inizio", a.inizio && fd(a.inizio))}${tr("Lavorazione", esc(a.perc))}${tr("Termine stimato", esc(a.fine))}</table>` : ""}
    <h3>Ore di volo</h3><table>${tr("Nel mese", fh(a.oreMese))}${tr("Totali", fh(a.oreTot))}</table>
    ${a.scadenze.length ? `<h3>Prossime scadenze</h3><table>${a.scadenze.map((x) => `<tr><td><span class="dot" style="background:${LV[Math.max(livello(x), 0)]}"></span>${esc(x.tipo)}</td><td>${valore(x)}</td></tr>`).join("")}</table>` : ""}
    ${a.motori.length ? `<h3>Turbomotori</h3><table>${a.motori.map((m) => tr(esc((m.tipo ? m.tipo + " " : "") + m.sn), m.fh != null ? fh(m.fh) + " h" : "–")).join("")}</table>` : ""}
    ${a.cessione ? `<h3>Cessione temporanea</h3><table>${tr("Da", esc(a.cessione.da))}${tr("A", esc(a.cessione.a))}${tr("Dal", a.cessione.dal && fd(a.cessione.dal))}</table>` : ""}
    <h3>Configurazione</h3><table>${tr("Config", esc(a.config))}${tr("Verricello", esc(a.verr))}${tr("Gancio", esc(a.gancio))}${tr("NVG", esc(a.nvg))}${tr("GG in linea / presenza", esc(a.ggLinea + " / " + a.ggPres))}</table></details></div>`;
  let ed = -1; // nota in modifica
  $("#cl").onclick = () => d.close();
  d.querySelector("details").ontoggle = (e) => S.info = e.target.open;
  d.querySelectorAll("[data-ed]").forEach((p) => p.onclick = () => { ed = +p.dataset.ed; $("#nt").value = note[ed].t; $("#ns").textContent = "Salva modifica"; $("#nt").focus(); });
  $("#ns").onclick = () => { const t = $("#nt").value.trim(); if (t) salva(sigla, "note", (arr = []) =>
    ed < 0 ? [...arr, { d: giornoIso(), t }] : arr.map((n, i) => i === ed ? { ...n, t } : n)); };
  d.querySelectorAll("[data-del]").forEach((b) => b.onclick = () => salva(sigla, "note", (arr = []) => arr.filter((_, i) => i !== +b.dataset.del)));
  d.querySelectorAll("[data-e]").forEach((b) => b.onclick = () => salva(sigla, "stati", () => ({ e: b.dataset.e === "1", m: $("#mo").value.trim(), d: giornoIso() })));
  if ($("#rp")) $("#rp").onclick = () => salva(sigla, "stati", () => null);
  if (!d.open) d.showModal();
}
async function salva(sigla, file, fn) {
  document.querySelectorAll("#dlg button").forEach((b) => b.disabled = true);
  try { await aggiorna(file, sigla, fn); render(); } catch (e) { toast(e.message); }
  dettaglio(sigla);
}
async function importa(ev) {
  const f = ev.target.files[0]; if (!f) return;
  try {
    const g = await Giornaliera.leggiGiornaliera(await f.arrayBuffer());
    if (!g.data) throw new Error("Data della giornaliera non trovata nel file");
    const d = $("#dlg");
    d.innerHTML = `<div class="dh"><div class="t"><b>Giornaliera del ${fd(g.data)}</b><div class="sub">${esc(f.name)}</div></div></div>
      <div class="db"><table>${g.linee.map((l) => `<tr><td>${esc(l.tipo)}</td><td>${l.aerei.length} aeromobili · ore mese ${fh(l.totMese)}</td></tr>`).join("")}</table>
      ${S.g && S.g.data > g.data ? `<p style="color:var(--warn)">È più vecchia di quella attuale (${fd(S.g.data)}): viene archiviata, la vista resta sull'ultima.</p>` : ""}
      <p><button class="btn pri" id="sv">Salva</button> <button class="btn" id="an">Annulla</button></p></div>`;
    $("#an").onclick = () => d.close();
    $("#sv").onclick = async () => {
      $("#sv").disabled = true;
      try { await scrivi("giornaliere/" + g.data + ".json", g, "giornaliera " + g.data); d.close(); await carica(); render(); toast("Giornaliera del " + fd(g.data) + " salvata"); }
      catch (e) { toast(e.message); $("#sv").disabled = false; }
    };
    d.showModal();
  } catch (e) { toast(e.message); }
  ev.target.value = "";
}
async function sblocca(frase) { // stesso schema di cifra.mjs: PBKDF2-SHA256 → AES-GCM
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b(SF_PAT.s), iterations: SF_PAT.n },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(SF_PAT.iv) }, k, b(SF_PAT.c)));
}
async function avvia() {
  const frase = ls("sf_frase");
  if (!frase) return vistaFrase();
  if (!window.SF_PAT) { $("#app").innerHTML = `<p class="empty">Configurazione da completare: manca la chiave di accesso ai dati.</p>`; return; }
  if (!PAT) try { PAT = await sblocca(frase); } catch (_) { ls("sf_frase", ""); return vistaFrase("Frase errata"); }
  try { await carica(); render(); }
  catch (e) { $("#app").innerHTML = `<p class="empty">${esc(e.message)}<br><br><button class="btn" onclick="avvia()">Riprova</button></p>`; }
}
avvia();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
