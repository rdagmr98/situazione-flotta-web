<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="robots" content="noindex">
<title>Situazione flotta</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#0b1220;--card:#131c2e;--card2:#1a2540;--line:#26324d;--tx:#e8edf7;--mu:#8b97b0;
--ok:#3ccf6e;--warn:#f5b942;--ko:#ff5a5a;--ind:#b48cff;--off:#6b7280}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
main{max-width:1100px;min-width:0;margin:0 auto;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:12px}
h1{font-size:20px;margin:0;flex:1 1 auto}
.sub{color:var(--mu);font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card2);color:var(--tx);
padding:8px 12px;border-radius:10px;font:inherit;cursor:pointer}
.btn.pri{background:#2b5cff;border-color:#2b5cff}
.btn:disabled{opacity:.5}
.tabs{display:flex;gap:6px;margin:4px 0 12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;border:1px solid var(--line);border-bottom:3px solid var(--line);
background:var(--card);color:var(--mu);padding:6px 2px;border-radius:10px;font:inherit;font-size:12px;cursor:pointer}
.tabs button b{font-size:13px;color:var(--mu);white-space:nowrap}
.tabs button[data-p="0"]{flex:.7}
.tabs button.on{background:var(--card2);border-bottom-color:var(--c)}
.tabs button.on b{color:var(--c)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 10px 0}
.chips button{border:1px solid var(--line);background:var(--card2);color:var(--mu);padding:5px 10px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:#2b5cff;border-color:#2b5cff;color:#fff}
.seg{display:flex;gap:8px;margin:8px 0}
.seg button{flex:1;border:1px solid var(--line);background:var(--card2);color:var(--mu);padding:10px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on[data-e="1"]{background:var(--ok);border-color:var(--ok);color:#062312}
.seg button.on[data-e="0"]{background:var(--ko);border-color:var(--ko);color:#fff}
details summary{cursor:pointer;color:#7aa2ff;font-weight:600;margin:16px 0 4px}
.pager{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;align-items:flex-start;overscroll-behavior-x:contain}
.pager::-webkit-scrollbar{display:none}
.pager>*{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.linea{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px;overflow:hidden}
.lh{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line)}
.lh img{width:96px;height:48px;object-fit:contain;flex:none}
.lh .t{flex:1;min-width:0}
.lh .t b{font-size:17px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px;padding:8px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--st);border-radius:10px;padding:8px 10px;cursor:pointer;min-width:0;text-align:left;color:var(--tx);font:inherit}
.tile b{display:block;font-size:21px}
.tile .h{display:block;font-size:14px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .dt{display:block;font-size:11px;font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.tile .st{font-size:12px;font-weight:600;color:var(--st);white-space:nowrap}
.tile .pill{position:absolute;top:4px;right:4px}
.fp{display:grid;grid-template-columns:1fr;gap:10px;padding:10px;align-items:start}
@media (min-width:720px){.fp{grid-template-columns:1fr 1fr}.fp.uno{grid-template-columns:1fr}}
.fp-box{background:var(--bg);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fp-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--card2);border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
.fp-h span{display:inline-flex;align-items:center;gap:6px}
.fp-sub{display:flex;align-items:center;justify-content:space-between;padding:5px 10px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mu);background:var(--card);border-top:1px solid var(--line)}
.fp-box>.fp-h+.fp-sub{border-top:0}
.fp-sub.corr{color:var(--ko)}
.fp-sub.prog{color:var(--warn)}
.fg{border-bottom:1px solid var(--line)}
.fg:last-child{border-bottom:0}
.fg-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--mu)}
.fg-h b{color:var(--tx);font-variant-numeric:tabular-nums}
.frow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-top:1px solid var(--line);border-left:4px solid var(--st);padding:8px 10px;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.frow:hover{background:var(--card2)}
.frow .fa{width:54px;flex:none}
.frow .fa b{display:block;font-size:17px;line-height:1.15}
.frow .fa .st{font-size:11px;font-weight:600;color:var(--st);white-space:nowrap}
.frow .fm{flex:1;min-width:0;font-size:13px;color:var(--mu)}
.frow .fm .fn{color:var(--tx);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frow .fv{display:flex;flex-direction:column;align-items:flex-end;gap:3px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;max-width:44%}
.frow .fv small{display:block;font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.al-box{margin:0 10px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 8px}
.al-box summary{margin:0;padding:8px 2px;font-size:13px;color:var(--mu)}
.al-box[open] summary{border-bottom:1px solid var(--line)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:middle}
.pill{font-size:10px;border:1px solid var(--line);border-radius:6px;padding:0 4px;color:var(--mu)}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:14px}
.list h2{font-size:15px;margin:0;padding:10px 12px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);border-left:4px solid var(--lv);cursor:pointer}
.row:last-child{border-bottom:0}
.row .a{width:64px;flex:none}
.row .a b{display:block}
.row .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.nr{align-items:flex-start}
.nr .m{white-space:normal;overflow-wrap:anywhere}
.nr .x{background:none;border:0;color:var(--mu);font-size:20px;line-height:1;padding:0 0 0 6px;cursor:pointer}
.nr .m div{margin-top:3px;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:#000a}
.dh{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
.dh img{width:72px;height:36px;object-fit:contain;flex:none}
.dh .t{flex:1;min-width:0}
@media (max-width:460px){
 main{padding:10px 10px calc(24px + env(safe-area-inset-bottom))}
 header{gap:6px 8px;margin-bottom:10px}h1{font-size:18px}.btn{padding:7px 10px}
 .tabs{gap:4px}.tabs button{padding:5px 2px;font-size:11px}.tabs button b{font-size:11.5px}.tabs button[data-p="0"]{flex:.65}
 .lh{gap:8px;padding:8px 10px}.lh img{width:64px;height:32px}.lh .btn{padding:6px 9px;font-size:13px}
 .row{gap:7px;padding:8px 10px}.row .a{width:54px}
 .frow{gap:8px;padding:8px 9px}.frow .fa{width:48px}
 dialog{width:calc(100vw - 16px)}
 .dh{gap:8px;padding:10px 12px}.dh img{width:48px;height:24px}.dh .sub{font-size:12px}}
.db{padding:4px 12px 14px}
.db h3{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.btn-xs{padding:4px 9px;font-size:12px;border-radius:8px;flex:none}
.det-box{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.det-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:6px 8px}
.det-top>div{flex:1;min-width:0}
.det-sh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 6px}
.det-sh h3{margin:0}
.det-ov{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 8px}
.det-ov div{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-variant-numeric:tabular-nums}
.det-ov span{display:block;font-size:12px;color:var(--mu)}
.det-ov b{font-size:16px}
.det-ed{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.det-av{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px}
.det-av-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 8px}
.det-av-row>div{flex:1;min-width:140px;overflow-wrap:anywhere}
.det-av-act{display:flex;gap:6px;align-items:center;flex:none}
.chiedi{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;margin:0 0 10px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;font-size:14px}
.av-warn{color:var(--warn);font-size:12px;font-weight:600;margin-top:2px}
.av-sug{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.av-sug button{border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:5px 9px;border-radius:8px;font:inherit;font-size:12px;cursor:pointer;text-align:left}
.av-sug button:hover{border-color:#7aa2ff;background:var(--card)}
.det-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
[hidden]{display:none!important}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:last-child{text-align:right}
.note{background:var(--card2);border-radius:10px;padding:8px 10px;margin-bottom:6px;display:flex;gap:8px}
.note.on{outline:2px solid #7aa2ff}
.note p{margin:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
.note small{color:var(--mu);display:block}
.note button[data-del]{background:none;border:0;color:var(--mu);font-size:18px;cursor:pointer;padding:0 4px}
.np-b{align-self:center;flex:none;font:inherit;font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;border:1px solid #7aa2ff66;background:#7aa2ff18;color:#7aa2ff;cursor:pointer;white-space:nowrap}
.np-b.off{border-color:var(--line);background:transparent;color:var(--mu);opacity:.65;text-decoration:line-through}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;color:var(--mu);cursor:pointer}
.chk input{width:auto;margin:0;accent-color:#7aa2ff}
textarea,input{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
textarea{min-height:70px;resize:vertical}
.msg{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222c44;border:1px solid var(--line);padding:9px 14px;border-radius:10px;max-width:calc(100vw - 32px);display:flex;align-items:center;gap:10px;z-index:20}
.empty{color:var(--mu);text-align:center;padding:40px 10px}
a{color:#7aa2ff}
select{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit}
.fm label{display:block;margin:8px 0;color:var(--mu);font-size:13px}
.fm label input,.fm label select{margin-top:3px}
.lr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0 10px;padding:4px 0;border-top:1px solid var(--line)}
.lr label{flex:1 1 150px;margin:6px 0}
.lr label.lt1{flex:2 1 220px}
.lr .btn{margin:6px 0}
.lr input{color-scheme:dark}
/* PPL: tema chiaro e sobrio, per il proiettore e per il Web Viewer di PowerPoint (?ppl) */
body.chiaro{background:#fff}
.chiaro main{max-width:none;padding:0}
.bf{--n:#1b2f55;--t:#1d2433;--m:#6b7487;--l:#e1e6ee;--z:#f6f8fb;
color:var(--t);background:#fff;height:100dvh;display:flex;flex-direction:column;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;line-height:1.3}
.bf .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--l);font-size:14px}
.bf .ctl button,.bf .ctl label{border:1px solid var(--l);background:#fff;color:var(--t);padding:5px 12px;border-radius:8px;font:inherit;cursor:pointer}
.bf .ctl button.on{background:var(--n);border-color:var(--n);color:#fff}
.bf .ctl b{font-size:15px;min-width:5.5em;text-align:center}
.bf .ctl i{font-style:normal;color:var(--m)}
.bf .ctl .sp{flex:1}
.bf .ctl .nav{display:flex;align-items:center;gap:6px}
.bf .tt{display:flex;align-items:center;gap:.8em;padding:.5em .8em .4em}
.bf .tt img{height:2.2em}
.bf .tt h1{font-size:1.6em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--n)}
.bf .tt h1 span{color:var(--m);font-weight:500;margin-right:.35em}
.bf .tt div{text-align:right;color:var(--m);font-size:.8em;line-height:1.3}
.bf .tt b{display:block;color:var(--n);font-size:1.6em}
.bf .kp{display:flex;gap:.6em;padding:0 .8em .6em}
.bf .kp div{flex:1;background:var(--z);border:1px solid var(--l);border-radius:.4em;padding:.3em .7em}
.bf .kp span{display:block;color:var(--m);font-size:.8em}
.bf .kp b{font-size:1.45em;color:var(--n);font-variant-numeric:tabular-nums}
.bf .tw{flex:1;overflow:auto;min-height:0;padding:0 .8em}
.bf table{border-collapse:collapse;width:100%;height:100%;table-layout:fixed;font-size:inherit;font-variant-numeric:tabular-nums}
.bf th,.bf td{border-bottom:1px solid var(--l);padding:.2em .4em;text-align:center;vertical-align:middle;line-height:1.2;overflow-wrap:anywhere;background:#fff}
.bf thead th{overflow-wrap:normal;color:var(--m);font-weight:600;font-size:.75em;text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid var(--n);position:sticky;top:0;z-index:2}
.bf thead th.og{color:var(--n);background:#fff4cc}
.bf tbody tr:nth-child(even)>*{background:var(--z)}
.bf .s{position:sticky;left:0;z-index:1;font-size:1.2em;font-weight:700;color:var(--n)}
.bf thead .s{z-index:3;font-size:.75em}
.bf .s button{display:block;margin:.3em auto 0;font:inherit;font-size:.5em;font-weight:500;padding:.2em .5em;border-radius:6px;border:1px solid var(--l);background:#fff;color:var(--t);cursor:pointer}
.bf [data-d]{cursor:pointer}
.bf .p{font-weight:600}
.bf .ei{display:inline-block;min-width:3.4em;padding:.1em .4em;border-radius:.35em;line-height:1.2}
.bf .lav{font-weight:600;font-size:.85em;line-height:1.15}
.bf .ed{cursor:pointer}
.bf .ed:hover{box-shadow:inset 0 0 0 2px var(--n)}
.bf td small{display:block;font-size:.7em;color:var(--m)}
.bf .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:left;font-size:.8em;line-height:1.2;color:var(--m)}
.bf td input{width:100%;min-width:0;padding:.2em;margin:0;text-align:center;font:inherit;font-weight:600;color:var(--t);background:#fffbe6;border:1px solid #c9a227;border-radius:4px;color-scheme:light}
.bf tfoot td,.bf tfoot th{background:#eef1f6;font-weight:700;color:var(--n)}
.bf tfoot tr:first-child>*{border-top:2px solid var(--n)}
.bf .neg{color:#b42318;font-weight:700}
.bf .wrn{color:#b45309;font-weight:700}
.bf .dv{font-weight:700;color:var(--n)}
.bf .nw{white-space:nowrap}
.bf .mese{height:auto;table-layout:auto}
.bf .anno{height:auto}
.bf .mp{display:grid;grid-template-columns:46fr 54fr;gap:.75em;align-items:start;padding-bottom:.35em}
.bf .mp.uno,.bf .mp.col{grid-template-columns:1fr}
.bf tbody tr:not(.grp){height:var(--rh)} /* adatta(): righe tutte alte uguali, per riempire lo schermo */
.bf .pn{border:1px solid var(--l);border-radius:.45em;overflow:hidden;background:#fff}
.bf .ph{display:flex;align-items:center;justify-content:space-between;gap:.6em;padding:.3em .65em;background:var(--z);border-bottom:2px solid var(--n);font-size:.82em;color:var(--m);white-space:nowrap;overflow:hidden}
.bf .ph .bg{display:inline-flex;align-items:center;gap:.38em;font-weight:700;color:var(--n);font-size:1.04em}
.bf .ph .gs{overflow:hidden;text-overflow:ellipsis}
.bf .mese th,.bf .mese td{border:0;border-bottom:1px solid var(--l);padding:.34em .5em;overflow-wrap:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bf .mese thead th{white-space:normal;border-bottom:2px solid var(--n);line-height:1.15;padding:.34em .45em}
.bf .mese thead th span{display:block;color:var(--n);font-weight:700;margin-top:.1em}
.bf .mese tbody tr:nth-child(even)>*{background:#fff}
.bf .mese tbody tr.alt>*{background:var(--z)}
.bf .mese tbody .s{font-size:1em;padding:.34em .6em}
.bf .mese .tl{text-align:left;white-space:normal}
.bf .mese .per{font-weight:400;opacity:.82}
.bf .mese td.pe{text-align:left;white-space:nowrap}
.bf .mese td.tl{white-space:nowrap} /* voci su una riga, righe tutte alte uguali: se non ci stanno adatta() rimpicciolisce */
.bf .mese td.tl:last-child{max-width:22em}
.bf .mese .lav{font-size:1em;line-height:1.2}
.bf .mese td b{font-weight:600}
.bf .mese .nw b{font-weight:700}
.bf .mese tbody tr.grp th,.bf .anno tbody tr.grp th{text-align:left;background:#fff;color:var(--n);font-size:.8em;font-weight:700;letter-spacing:.03em;padding:.55em .5em .12em;border-bottom:1px solid #cbd5e1}
.bf .mese tbody tr.grp.corr th{color:#b42318}
.bf.mod .mese tbody .s{padding:.18em .3em}
.bf.mod .mese .s button{margin:.18em auto 0;font-size:.66em;padding:.14em .42em;border-radius:4px;white-space:nowrap}
.bf.mod .mese td input{padding:.14em .2em;line-height:1.15;box-sizing:border-box}
.bf .anno td,.bf .anno th{padding:.08em .26em}
.bf .anno tbody tr:nth-child(even)>*{background:#fff}
.bf .anno tbody tr.alt>*{background:var(--z)}
.bf .anno tbody tr>td.og,.bf .anno td.og{background:#fffbeb}
.bf .anno tbody tr.alt>td.og{background:#fcf5d8}
.bf .anno tfoot td.og{background:#f7ebc2}
.bf .anno tfoot td{white-space:nowrap}
.bf .anno .rp{color:var(--m);opacity:.72;font-weight:400}
.bf .anno .rp.neg{color:#b42318;font-weight:600}
.bf .anno .s button{white-space:nowrap}
.bf.mod .anno td,.bf.mod .anno th{padding:.06em .22em}
.bf.mod .anno td input{padding:.08em .12em;line-height:1.15}
.bf.mod .anno .s button{margin:.15em auto 0;padding:.12em .4em}
.bf.mod .anno .lav br{display:none}
.bf.mod .anno .lav .lt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:.12em}

<body>
<main id="app"><p class="empty">Caricamento...</p></main>
<dialog id="dlg"></dialog>
<script src="giornaliera.js"></script>

<script>
"use strict";
const API = "https://api.github.com/repos/rdagmr98/situazione-flotta-data/contents/";
const ORE_WARN = 25 * 60, GG_WARN = 60; // stesse soglie del SIEL: < 25 h o < 60 giorni
const TIPI = { // silhouette e colori di AVES Tecnici (helicopter_catalog.dart)
  "RH-206C": ["ab206", "#FFC14D"], "UH-205A": ["uh205", "#FF8A65"],
  "UH-169B": ["uh169b", "#35C2FF"], "UH-169D": ["uh169d", "#7CF29A"] };
const STATI = { "IN LINEA": ["ok", "IN LINEA"], "DISPONIBILE": ["warn", "DISP."], "INDISPONIBILE": ["ko", "INDISP."],
  "INDUSTRIA": ["ind", "INDUSTRIA"], "ALIENAZIONE": ["off", "ALIEN."] };
const CAT = { eff: ["ok", "EFF", "Efficiente"], ineff: ["ko", "INEFF", "Inefficiente"], ind: ["ind", "IND.", "In industria"], alien: ["off", "ALIEN.", "In alienazione"] };
const CAT_VIS = {
  eff: ["ok", "EFF", "Efficiente"],
  corr: ["ko", "AVARIA", "Fermo correttivo"],
  prog: ["warn", "PROG", "Fermo programmato"],
  altro: ["warn", "CESS.", "Cessione temporanea"],
  ind: ["ind", "IND.", "In industria"],
  alien: ["off", "ALIEN.", "In alienazione"]
};
const catVis = (x) => CAT_VIS[x.c === "eff" ? "eff" : x.c === "ind" ? "ind" : x.c === "alien" ? "alien" : x.kind === "corr" ? "corr" : x.kind === "altro" ? "altro" : "prog"];
const FILTRI = [
  ["tutti", "Tutti", () => true],
  ["eff", "Efficienti", (x) => x.c === "eff"],
  ["corr", "Avarie", (x) => x.kind === "corr"],
  ["ineff", "Fermi", (x) => x.c === "ineff" || x.c === "ind"],
  ["ind", "Industria", (x) => x.c === "ind"],
  ["alien", "Alienazione", (x) => x.c === "alien"]
];
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let PAT = ""; // in chiaro solo in memoria: nella pagina pubblica c'è cifrato (pat.js)
const ls = (k, v) => { try { return v === undefined ? localStorage.getItem(k) || "" : localStorage.setItem(k, v); } catch (_) { return ""; } };
// stati.json = { sigla: { e: efficiente?, m: motivo, d: giorno, ppl? } }: correzione giornaliera o avaria pregressa
// avarie.json = { sigla: [{ d: giorno, t: testo, ppl? }] }: avarie aperte a mano (non spariscono alla nuova giornaliera)
const S = { g: null, note: {}, stati: {}, avarie: {}, ppl: {}, vol: {}, vista: "macchine", flotta: ls("sf_flotta"), filtro: ls("sf_filtro") || "tutti", info: false };
S.pag = ls("sf_pag");
const KIOSK = new URLSearchParams(location.search).has("ppl"); // ?ppl: solo la PPL in sola lettura, per il Web Viewer di PowerPoint
if (KIOSK) { S.pag = "brief"; setInterval(() => carica().then(render).catch(() => {}), 6e5); } // si aggiorna da sola ogni 10 minuti

// --- formati ---
const fh = (m) => m == null ? "–" : (m < 0 ? "-" : "") + Math.floor(Math.abs(m) / 60) + ":" + String(Math.abs(m) % 60).padStart(2, "0");
const fd = (d) => d ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) : "–";
const oggi = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const giorni = (d) => Math.round((new Date(d + "T00:00:00") - oggi()) / 864e5);
const diffGg = (d) => d ? Math.max(0, -giorni(d)) : null;
const txtGg = (d) => { const g = diffGg(d); return g == null ? "" : g === 0 ? "da oggi" : g === 1 ? "da 1 g" : `da ${g} gg`; };
const tipo = (t) => TIPI[t] || ["ab206", "#8b97b0"];
const stato = (s) => STATI[s] || ["off", s || "?"];
function livello(sc) { // 2 = scaduta, 1 = vicina, 0 = ok, -1 = senza valore
  if (sc.ore != null) return sc.ore <= 0 ? 2 : sc.ore < ORE_WARN ? 1 : 0;
  if (sc.data) { const g = giorni(sc.data); return g < 0 ? 2 : g < GG_WARN ? 1 : 0; }
  return -1;
}
const LV = ["var(--ok)", "var(--warn)", "var(--ko)"];
const valore = (sc) => sc.ore != null ? fh(sc.ore) + " h" : sc.data ? fd(sc.data) + " (" + giorni(sc.data) + " gg)" : esc(sc.raw || "–");
const vive = (a) => a.stato !== "ALIENAZIONE";
const disp = (a) => { const o = a.scadenze.filter((s) => s.ore != null).map((s) => s.ore); return o.length ? Math.min(...o) : null; }; // ore alla prossima scadenza a ore
const scadDataUrg = (a) => a.scadenze.filter((s) => s.data && livello(s) >= 1).sort((x, y) => x.data.localeCompare(y.data))[0] || null; // scadenza a data imminente o scaduta
const motivoFermo = (a, x) => x.m ? breve(x.m) : x.man ? "Segnalata a mano" : x.c === "ind" ? "In industria" : stato(a.stato)[1];
// righe nascoste della pagina Note (solo su questo dispositivo): ricompaiono se cambiano note o efficienza
const firma = (s) => JSON.stringify([S.note[s] || null, S.stati[s] || null, S.avarie[s] || null]);
const nascoste = () => { try { return JSON.parse(ls("sf_nascoste") || "{}"); } catch (_) { return {}; } };
const giornoIso = () => new Date().toLocaleDateString("sv-SE"); // AAAA-MM-GG locale, non UTC
function avarieMan(sigla) {
  const list = (S.avarie[sigla] || []).map((x, i) => ({ ...x, _src: "avarie", _i: i }));
  const o = S.stati[sigla];
  if (o && !o.e && S.g && o.d >= S.g.data) list.push({ d: o.d, t: o.m || "Segnalata a mano", ppl: o.ppl, _src: "stati", _i: 0 });
  return list;
}
function eff(a, opt = true) { // { c, kind, m, da, man, av, confermata, chiedi }
  if (!vive(a)) return { c: "alien", kind: "alien", m: "", da: "" };
  const aMano = typeof opt === "boolean" ? opt : opt.aMano !== false;
  const brief = typeof opt === "object" && !!opt.brief;
  const gKind = Giornaliera.classificaFermo(a);
  let auto;
  if (a.stato === "INDUSTRIA") auto = { c: "ind", kind: "ind", m: a.attivita, da: a.inizio || "" };
  else if (a.stato !== "IN LINEA") auto = { c: "ineff", kind: gKind || "corr", m: a.attivita, da: a.inizio || (a.cessione && a.cessione.dal) || "" };
  else {
    const z = a.scadenze.find((s) => s.ore != null && s.ore <= 0); // in linea ma senza ore: non può volare
    auto = z ? { c: "ineff", kind: gKind || "prog", m: "ore a zero, " + z.tipo, da: "" } : { c: "eff", kind: "eff", m: "", da: "" };
  }
  if (!aMano) return auto;
  const avAll = avarieMan(a.sigla);
  // la giornaliera comanda: se dopo l'avaria dà la macchina IN LINEA è efficiente, e l'app chiede «risolta?» finché non rispondi (No = ok: data giornaliera)
  const chiedi = auto.c === "eff" ? avAll.filter((v) => S.g.data > v.d && !(v.ok >= S.g.data)) : [];
  const avVis = avAll.filter((v) => !chiedi.includes(v) && !(brief && v.ppl === false));
  const o = S.stati[a.sigla];
  if (o && o.e && S.g && o.d >= S.g.data && !avVis.length) return { c: "eff", kind: "eff", m: o.m, da: o.d, man: o, chiedi };
  if (!avVis.length) return { ...auto, chiedi };
  const av0 = avVis[0], daMin = [auto.da, ...avVis.map((v) => v.d)].filter(Boolean).sort()[0] || "";
  if (auto.c === "eff") {
    return { c: "ineff", kind: "corr", m: avVis.map((v) => v.t).join(" · "), da: daMin, man: av0, av: avVis, chiedi };
  }
  const conf = S.g.data > av0.d;
  if (conf && auto.kind !== "corr") {
    return { c: auto.c, kind: auto.kind, m: auto.m || av0.t, da: auto.da || daMin, av: avVis, confermata: true };
  }
  const testi = [...new Set([auto.m, ...avVis.map((v) => v.t)].filter(Boolean))];
  return {
    c: "ineff", kind: "corr",
    m: auto.kind === "corr" && auto.m ? (conf ? auto.m : testi.join(" · ")) : avVis.map((v) => v.t).join(" · "),
    da: daMin, man: conf ? null : av0, av: avVis, confermata: conf
  };
}
function conta(aerei, brief = false) { const v = aerei.filter(vive), e = v.filter((a) => eff(a, { brief }).c === "eff").length; return [e, v.length, Math.round(100 * e / (v.length || 1))]; }

// --- dati: repo privato via GitHub Contents API ---
async function gh(path, opts = {}) {
  const r = await fetch(API + path, { ...opts, cache: "no-store", headers: {
    Authorization: "Bearer " + PAT, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "Token non valido o senza accesso al repo dati" : "Errore GitHub " + r.status);
  return r.json();
}
const dec = (b) => new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\s/g, "")), (c) => c.charCodeAt(0)));
const enc = (s) => { let b = ""; new TextEncoder().encode(s).forEach((x) => b += String.fromCharCode(x)); return btoa(b); };
async function leggi(path) { const j = await gh(path); return j ? { sha: j.sha, data: JSON.parse(dec(j.content)) } : { sha: null, data: null }; }
async function scrivi(path, data, msg) {
  const { sha } = await leggi(path); // sha fresco: niente 409 se l'altro dispositivo ha scritto nel frattempo
  await gh(path, { method: "PUT", body: JSON.stringify({ message: msg, content: enc(JSON.stringify(data, null, 1)), sha: sha || undefined }) });
}
async function carica() {
  const dir = (await gh("giornaliere")) || [];
  const nomi = dir.map((f) => f.name).filter((n) => /\.json$/.test(n)).sort(), ult = nomi[nomi.length - 1];
  const [g, n, s, q, av] = await Promise.all([
    ult ? leggi("giornaliere/" + ult) : { data: null },
    leggi("note.json"), leggi("stati.json"), leggi("ppl.json"), leggi("avarie.json")
  ]);
  S.g = g.data; S.note = n.data || {}; S.stati = s.data || {}; S.ppl = q.data || {}; S.avarie = av.data || {}; S.vol = {};
  if (!S.g) return;
  S.g.linee.sort((a, b) => ordine(a.tipo) - ordine(b.tipo));
  // volato per la PPL: ore mese dell'ultima giornaliera di ogni mese, dal primo anno di PPL
  const a0 = Object.keys(S.ppl).map((k) => k.split("|")[1]).sort()[0], m1 = S.g.data.slice(0, 7), um = {};
  for (const x of nomi) um[x.slice(0, 7)] = x;
  const mesi = Object.keys(um).filter((m) => a0 && m >= a0 && m < m1);
  S.vol = Object.fromEntries(await Promise.all(mesi.map(async (m) => [m, oreG((await leggi("giornaliere/" + um[m])).data)])));
  S.vol[m1] = oreG(S.g);
  // mese con giornaliere incomplete (es. ottobre 2026 solo al 7): volato = ore totali a inizio mese dopo − a inizio mese
  for (const m of mesi) { const a = S.vol[m], b = S.vol[Piano.piuMesi(m, 1)];
    if (b) for (const s in a.o) if (a.i[s] != null && b.i[s] != null) a.o[s] = Math.max(a.o[s], b.i[s] - a.i[s]); }
}
const oreG = (g) => { const ae = g.linee.flatMap((l) => l.aerei); // o = ore del mese, i = ore totali a inizio mese
  return { d: g.data, o: Object.fromEntries(ae.map((a) => [a.sigla, a.oreMese || 0])), i: Object.fromEntries(ae.filter((a) => a.oreTot != null).map((a) => [a.sigla, a.oreTot - (a.oreMese || 0)])) }; };
async function aggiorna(file, sigla, fn) { // rilegge, modifica, scrive: le modifiche dell'altro dispositivo non si perdono
  const cur = (await leggi(file + ".json")).data || {};
  const v = fn(cur[sigla]);
  if (v == null || v.length === 0) delete cur[sigla]; else cur[sigla] = v;
  await scrivi(file + ".json", cur, file + " " + sigla);
  S[file] = cur;
}
const AV_TIPICI = ["Spia chip detector", "Perdita olio", "Attesa materiale", "Vibrazioni eccessive", "Avaria avionica", "Ricerca guasti"];
function salvaRecAvaria(t) {
  try {
    const cur = JSON.parse(ls("sf_av_rec") || "[]").filter((x) => x.toLowerCase() !== t.toLowerCase());
    ls("sf_av_rec", JSON.stringify([t, ...cur].slice(0, 8)));
  } catch (_) {}
}
function suggerimentiAvarie() {
  const rec = (() => { try { return JSON.parse(ls("sf_av_rec") || "[]"); } catch (_) { return []; } })();
  const daDati = [
    ...Object.values(S.avarie).flat().map((x) => x.t),
    ...Object.values(S.stati).filter((x) => !x.e && x.m).map((x) => x.m),
    ...(S.g ? S.g.linee.flatMap((l) => l.aerei).filter((a) => Giornaliera.classificaFermo(a) === "corr" && a.attivita).map((a) => breve(a.attivita)) : [])
  ];
  const seen = new Set(), out = [];
  for (const t of [...rec, ...daDati, ...AV_TIPICI]) {
    const s = String(t || "").trim(), k = s.toLowerCase();
    if (!s || seen.has(k)) continue;
    seen.add(k); out.push(s);
    if (out.length >= 8) break;
  }
  return out;
}
const conPpl = (n, on) => { const r = { ...n }; if (on) delete r.ppl; else r.ppl = false; return r; };
const notaPpl = (n, on) => on ? { d: n.d, t: n.t } : { d: n.d, t: n.t, ppl: false };
const invPpl = (idx) => (arr = []) => arr.map((n, i) => i === idx ? conPpl(n, n.ppl === false) : n);
const btnPpl = (n, kind, idx, s) => `<button class="np-b${n.ppl === false ? " off" : ""}" data-ppl-k="${kind}" data-ppl-i="${idx}"${s ? ` data-ppl-s="${esc(s)}"` : ""} type="button" title="Mostra o nascondi al briefing (PPL)">${n.ppl === false ? "No PPL" : "PPL"}</button>`;
const ancoraFerma = (sigla, v) => aggiorna("avarie", sigla, (arr = []) => arr.map((x, i) => i === v._i && x.t === v.t && x.d === v.d ? { ...x, ok: S.g.data } : x));
async function chiudiAvaria(sigla, item, reopenDet = false) {
  const snap = item._src === "stati" ? { ...(S.stati[sigla] || {}) } : { d: item.d, t: item.t, ...(item.ppl === false ? { ppl: false } : {}) };
  const fn = item._src === "stati"
    ? () => null
    : (arr = []) => arr.filter((x, idx) => !(idx === item._i && x.t === item.t && x.d === item.d));
  try {
    await aggiorna(item._src, sigla, fn);
    render();
    if (reopenDet) dettaglio(sigla);
    toast("Avaria su " + sigla + " chiusa", async () => {
      try {
        await aggiorna(item._src, sigla, (cur) => item._src === "stati" ? snap : [...(cur || []), snap]);
        render();
        if (reopenDet && $("#dlg").open) dettaglio(sigla);
      } catch (e) { toast(e.message); }
    });
  } catch (e) { toast(e.message); if (reopenDet) dettaglio(sigla); }
}

// --- viste ---
function toast(t, undoFn) {
  document.querySelectorAll(".msg").forEach((el) => el.remove());
  const d = document.createElement("div"); d.className = "msg";
  d.append(Object.assign(document.createElement("span"), { textContent: t }));
  if (undoFn) {
    const b = document.createElement("button"); b.className = "btn btn-xs"; b.type = "button"; b.textContent = "Annulla";
    b.onclick = () => { d.remove(); undoFn(); };
    d.append(b);
  }
  document.body.append(d); setTimeout(() => d.remove(), undoFn ? 5500 : 3500);
}
function vistaFrase(err) {
  $("#app").innerHTML = `<header><h1>Situazione flotta</h1></header>
  <form class="list" style="padding:14px" id="fr">
   <p>Frase di accesso (una volta per dispositivo, resta in questo browser).</p>
   ${err ? `<p style="color:var(--ko)">${esc(err)}</p>` : ""}
   <input type="password" id="tok" autocomplete="current-password" autocapitalize="none">
   <p><button class="btn pri">Entra</button></p></form>`;
  $("#fr").onsubmit = (e) => { e.preventDefault(); ls("sf_frase", $("#tok").value.trim().toLowerCase()); avvia(); };
}
function oggiPage(g, ann, nn) {
  const corr = g.linee.flatMap((l) => l.aerei.map((a) => ({ l, a, x: eff(a) })).filter(({ x }) => x.kind === "corr"))
    .sort((u, v) => (!!(v.x.av && v.x.av.length) - !!(u.x.av && u.x.av.length)) || (u.x.da || "9999").localeCompare(v.x.da || "9999") || u.a.sigla.localeCompare(v.a.sigla));
  const avHtml = corr.map(({ l, a, x }) => {
    const [, stL, stT] = catVis(x), av0 = x.av && x.av[0], gg = txtGg(x.da), dt = x.da ? (gg ? gg + " · " : "") + "dal " + fd(x.da).slice(0, 5) : "in giorn. " + fd(g.data).slice(0, 5);
    const meta = [dt, x.confermata ? "Confermata da giorn." : ""].filter(Boolean).join(" · ");
    const btnClose = av0 ? `<button class="btn btn-xs" type="button" data-close-av="${esc(a.sigla)}" data-av-src="${av0._src}" data-av-i="${av0._i}" data-av-d="${esc(av0.d)}" data-av-t="${esc(av0.t)}" title="Chiudi avaria in 1 tocco">Risolta</button>` : "";
    return `<div class="row nr" data-s="${esc(a.sigla)}" style="--lv:var(--ko)" title="${esc(stT)}">
      <div class="a"><b>${esc(a.sigla)}</b><span class="sub">${esc(l.tipo)}</span></div>
      <div class="m"><b>${esc(x.m || "Avaria")}</b><div><span class="sub">${esc(meta)}</span>${av0 ? btnPpl(av0, av0._src, av0._i, a.sigla) : ""}</div></div>
      <div class="v">${btnClose || `<b style="color:var(--ko)">${stL}</b>`}</div></div>`;
  }).join("");
  const scadUrg = g.linee.flatMap((l) => l.aerei.filter((a) => eff(a).c === "eff").map((a) => {
    const h = disp(a), du = scadDataUrg(a), hUrg = h != null && h < ORE_WARN;
    const zo = hUrg ? a.scadenze.find((s) => s.ore === h) : null; // la scadenza a ore più vicina
    return (hUrg || du) ? { l, a, h, du, zo, score: hUrg ? h : 10000 + giorni(du.data) } : null;
  }).filter(Boolean)).sort((u, v) => u.score - v.score);
  const scadHtml = scadUrg.map(({ l, a, h, du, zo }) => `<div class="row" data-s="${esc(a.sigla)}" style="--lv:var(--warn)">
    <div class="a"><b>${esc(a.sigla)}</b><span class="sub">${esc(l.tipo)}</span></div>
    <div class="m">${[zo && esc(zo.tipo), du && esc(du.tipo) + " (" + giorni(du.data) + " gg)"].filter(Boolean).join(" · ")}</div>
    <div class="v">${zo ? `<b style="color:${LV[livello({ ore: h })]}">${fh(h)} h</b>` : ""}</div></div>`).join("");
  return `<div class="oggi-col">
    <section class="list"><h2>Avarie aperte · ${corr.length}</h2>${avHtml || '<p class="empty">Nessuna avaria aperta su tutta la flotta.</p>'}</section>
    ${scadUrg.length ? `<section class="list"><h2>Efficienti in scadenza · ${scadUrg.length}</h2>${scadHtml}</section>` : ""}
    <section class="list"><h2>Note e correzioni</h2>${ann.map(annotata).join("")
      || '<p class="empty">Nessuna nota: tocca una macchina per aggiungerne.</p>'}${nn ? `<p style="text-align:center"><button class="btn" id="rn">Mostra nascoste (${nn})</button></p>` : ""}</section>
  </div>`;
}
function render() {
  const g = S.g;
  const imp = `<label class="btn pri">Importa<input type="file" accept=".ods" id="file" hidden></label>`;
  if (!g) {
    $("#app").innerHTML = `<header><h1>Situazione flotta</h1>${imp}</header>
      <p class="empty">Nessuna giornaliera ancora. Dal PC: «Importa giornaliera» e scegli il file SIT_GIOR_CAAE .ods.</p>`;
    $("#file").onchange = importa; return;
  }
  document.body.classList.toggle("chiaro", S.pag === "brief");
  if (S.pag === "brief") return renderBrief();
  const [E, T, P] = conta(g.linee.flatMap((l) => l.aerei));
  const nAv = g.linee.flatMap((l) => l.aerei).filter((a) => eff(a).kind === "corr").length;
  const dom = g.linee.flatMap((l) => l.aerei.flatMap((a) => (eff(a).chiedi || []).map((v) => ({ a, v }))));
  const pag = ["note", ...g.linee.map((l) => l.tipo)], k0 = pag.indexOf(S.flotta), i = k0 < 0 ? 1 : k0;

    const fg = (await Giornaliera.leggiPpl(await f.arrayBuffer())).map((x) => ({ ...x, tipo: S.g.linee.map((l) => l.tipo).find((t) => n(t).endsWith(n(x.foglio))) }));
    const d = $("#dlg");
    d.innerHTML = `<div class="dh"><div class="t"><b>Importa PPL</b><div class="sub">${esc(f.name)}</div></div><button class="btn" id="cl">Chiudi</button></div>
     <form class="db" id="fpp"><table>${fg.map((x, k) => `<tr><td><label><input type="checkbox" name="k${k}" style="width:auto"${x.tipo ? " checked" : " disabled"}> ${esc(x.foglio)}</label></td>
      <td>${x.tipo ? `${esc(x.tipo)} · ${Object.keys(x.righe).length} macchine` : "tipo non in flotta"}</td>
      <td><input name="a${k}" type="number" min="2020" max="2099" value="${y || x.anno || ""}" style="width:90px"${x.tipo ? " required" : ""}>${x.anno && x.anno !== y ? `<small class="sub"> nel foglio: ${x.anno}</small>` : ""}</td></tr>`).join("")}</table>
      <p class="sub">Anno preso dal nome del file: correggilo se serve. La PPL già importata per lo stesso tipo e anno viene sostituita.</p>
      <p><button class="btn pri">Salva</button></p></form>`;
    $("#cl").onclick = () => d.close();
    $("#fpp").onsubmit = (e) => { e.preventDefault(); const v = Object.fromEntries(new FormData(e.target)), ora = new Date().toISOString();
      const sel = fg.map((x, k) => [x, v["a" + k]]).filter((_, k) => v["k" + k]);
      if (!sel.length) return d.close();
      salvaPpl(f.name, (p) => { for (const [x, a] of sel) p[x.tipo + "|" + a] = { file: f.name, foglio: x.foglio, importata: ora, righe: x.righe }; }); };
    d.showModal();
  } catch (e) { toast(e.message); }
}
async function salvaPpl(msg, fn, fatto) { // rilegge, modifica, scrive (niente modifiche perse fra dispositivi), poi ricarica per il volato dei mesi nuovi
  document.querySelectorAll("#dlg button, #app button").forEach((b) => b.disabled = true);
  try { const p = (await leggi("ppl.json")).data || {}; fn(p); await scrivi("ppl.json", p, "ppl: " + msg); $("#dlg").close(); if (fatto) fatto(); await carica(); toast("PPL salvata"); render(); return; }
  catch (e) { toast(e.message); }
  render();
}
async function sblocca(frase) { // stesso schema di cifra.mjs: PBKDF2-SHA256 → AES-GCM
  const b = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(frase), "PBKDF2", false, ["deriveKey"]);
  const k = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b(SF_PAT.s), iterations: SF_PAT.n },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  return new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(SF_PAT.iv) }, k, b(SF_PAT.c)));
}
async function avvia() {
  const frase = new URLSearchParams(location.hash.slice(1)).get("k") || ls("sf_frase"); // #k=frase nel link del Web Viewer: niente frase da digitare (il frammento non va al server)
  if (!frase) return vistaFrase();
  if (!window.SF_PAT) { $("#app").innerHTML = `<p class="empty">Configurazione da completare: manca la chiave di accesso ai dati.</p>`; return; }
  if (!PAT) try { PAT = await sblocca(frase); } catch (_) { ls("sf_frase", ""); return vistaFrase("Frase errata"); }
  try { await carica(); render(); }
  catch (e) { $("#app").innerHTML = `<p class="empty">${esc(e.message)}<br><br><button class="btn" onclick="avvia()">Riprova</button></p>`; }
}
avvia();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
